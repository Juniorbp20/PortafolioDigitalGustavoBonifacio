    <script>
        (function () {
            try {
                var storedTheme = localStorage.getItem('portfolio-theme');
                var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                var theme = storedTheme === 'light' || storedTheme === 'dark'
                    ? storedTheme
                    : (prefersLight ? 'light' : 'dark');

                document.documentElement.dataset.theme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = 'dark';
            }

            try {
                if ('IntersectionObserver' in window &&
                    !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    document.documentElement.classList.add('reveal-enabled');

                    window.setTimeout(function () {
                        if (!window.__portfolioReady) {
                            document.documentElement.classList.remove('reveal-enabled');
                        }
                    }, 3000);
                }
            } catch (error) {
                document.documentElement.classList.remove('reveal-enabled');
            }
        })();
    </script>

    <style>
        .app-loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            align-items: center;
            justify-content: center;
            background: #060a11;
            color: #edf4ff;
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        }

        html[data-theme="light"] .app-loading {
            background: #f4f7fb;
            color: #0b1424;
        }

        .app-loading-mark {
            font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .app-loading-mark span {
            color: #38bdf8;
        }

        .app-loading-text {
            font-size: 0.86rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .app-loading-bar {
            width: 132px;
            height: 3px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.22);
        }

        .app-loading-bar::after {
            content: "";
            display: block;
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            animation: app-loading-slide 1.1s ease-in-out infinite;
        }

        @keyframes app-loading-slide {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(320%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .app-loading-bar::after {
                width: 100%;
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="app-loading" role="status" aria-live="polite">
            <span class="app-loading-mark" aria-hidden="true">GB<span>.</span></span>
            <span class="app-loading-bar" aria-hidden="true"></span>
            <span class="app-loading-text">Cargando portafolio…</span>
        </div>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/portfolio.js" defer></script>
</body>
